services:
  sagemath:
    image: ${SAGEMATH_IMAGE:-sagemath/sagemath:latest}
    working_dir: /workspace
    command: ["sage", "-python", "docker/sagemath/mcp_server.py"]
    volumes:
      - .:/workspace
    ports:
      - "${SAGEMATH_HOST_PORT:-18000}:8000"
    environment:
      SAGEMATH_MCP_HOST: 0.0.0.0
      SAGEMATH_MCP_PORT: 8000
    healthcheck:
      test:
        [
          "CMD",
          "sage",
          "-python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    ports:
      - "${SEARXNG_HOST_PORT:-8080}:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_PUBLIC_URL:-http://localhost:8080/}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  claw-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    working_dir: /workspace
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${HOST_WORKSPACE_DIR:-.}
        target: /workspace
